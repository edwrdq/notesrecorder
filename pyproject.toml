[project]
name = "lecture-capture"
version = "0.1.0"
description = "Dockerized lecture capture web app with browser audio streaming, live transcription, and Parakeet post-processing."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "nemo_toolkit[asr]>=2.7.0,<3.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "RealtimeSTT>=0.3.104,<0.4.0",
  "torch>=2.10.0,<3.0.0",
  "torchaudio>=2.10.0,<3.0.0",
  "uvicorn[standard]>=0.34.0,<0.35.0",
]

[dependency-groups]
dev = [
  "ruff>=0.11.0,<0.12.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

